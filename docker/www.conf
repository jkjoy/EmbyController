[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
ping.path = /fpm-ping
ping.response = pong
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /app
; 保留 Compose 传入的数据库环境变量，PHP 的 $_ENV 由 EGPCS 配置填充。
clear_env = no
php_admin_value[open_basedir] = /app/:/tmp/
