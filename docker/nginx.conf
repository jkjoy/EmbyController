# 外部 Nginx 与应用容器位于同一台宿主机；完整部署步骤见 README。
# 修改域名和监听端口。root 是宿主机路径，SCRIPT_FILENAME 是容器内路径。
server {
    listen 80;
    server_name emby.example.com;
    root /srv/emby-controller/public;
    index index.php;
    client_max_body_size 20m;

    access_log /var/log/nginx/emby-controller.access.log;
    error_log /var/log/nginx/emby-controller.error.log;

    # 浏览器使用同域 /ws；2347 无需向公网开放。
    location = /ws {
        proxy_pass http://127.0.0.1:2347;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 静态文件由 Nginx 读取；动态路由保留 PATH_INFO 和查询参数。
    location / {
        try_files $uri $uri/ /index.php$uri$is_args$args;
    }

    location ~ /\. {
        deny all;
    }

    # 只执行前端入口。不要使用宿主机的 $document_root 拼接脚本路径。
    location ~ ^/index\.php(?:/|$) {
        fastcgi_split_path_info ^(/index\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }
}
