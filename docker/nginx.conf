# 可选的宿主机 Nginx：HTTP 反代到应用容器的 Caddy，不需要 PHP 或静态文件副本。
# 应用 ports 使用 127.0.0.1:8018:8018；可信代理和 HTTPS 步骤见 README。
server {
    listen 80;
    server_name emby.example.com;
    client_max_body_size 20m;

    access_log /var/log/nginx/emby-controller.access.log;
    error_log /var/log/nginx/emby-controller.error.log;

    location / {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket 同样通过 8018；Caddy 再转发到容器内部的 2347。
    location = /ws {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

}
