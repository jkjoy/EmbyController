version: '3.8'

services:
  emby-controller:
    image: ghcr.io/jkjoy/emby-controller:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 默认使用持久化 SQLite；其它设置在管理后台保存。
    environment:
      DB_DRIVER: "sqlite"
      DB_TYPE: "sqlite"
      DB_NAME: "/app/data/emby-controller.sqlite"
      DB_PREFIX: "rc_"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:2347:2347"
