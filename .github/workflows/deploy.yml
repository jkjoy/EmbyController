name: Publish image to GHCR

# 推送主分支、发布 Release 或手动触发时构建并发布到 GHCR
on:
  push:
    branches:
      - master
      - main
  release:
    types: [published]
  workflow_dispatch:        # 也支持在 Actions 页面手动触发

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # 读取代码
      packages: write       # 推送镜像到 ghcr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: echo "name=${REGISTRY}/${GHCR_OWNER,,}/emby-controller" >> "$GITHUB_OUTPUT"

      # 使用内置 GITHUB_TOKEN 登录，无需额外配置 secrets
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动根据 Release tag 生成镜像标签
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify direct HTTP access and container lifecycle
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: python3 tests/container_runtime.py "${IMAGE_NAME}:latest"

      - name: Push verified Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then
              docker push "$image_tag"
            fi
          done <<< "$IMAGE_TAGS"
